<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://xajmblrdkdnqoxfvsfrt.supabase.co"
    />
    <title>Desktop Shark</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 창틀도 배경도 없다. 바탕화면이 곧 물속이라 배경은 칠하지 않는다. -->
    <canvas id="stage"></canvas>

    <!-- 게임모드에서만 보이는 눈금. 클릭은 안 받는다(밥이 가려지면 안 된다). -->
    <div id="hud" hidden>
      <span id="hud-stage">1단계</span>
      <span class="sep">·</span>
      <span id="hud-hunger">배부름</span>
      <span class="sep">·</span>
      <span id="hud-next">다음까지 5</span>
    </div>

    <!-- ⌥⇧R 로 여는 패널. 여기만 클릭·타이핑을 받는다. -->
    <div id="panel" hidden>
      <!-- 여기를 잡고 끈다. 창틀이 없으니 손잡이를 따로 만들어 준다. -->
      <div id="grip">
        <h1>바탕화면 상어</h1>
        <button id="close-panel" title="닫기 (⌥⇧R)" aria-label="닫기">×</button>
      </div>

      <div id="tabs">
        <button class="tab on" data-tab="dex">도감</button>
        <button class="tab" data-tab="rank">랭킹</button>
      </div>

      <section id="tab-dex">
        <p class="muted" id="dex-now"></p>
        <div id="dex-list"></div>

        <div class="row" id="stage-row">
          <label id="freeze-switch">
            <input id="frozen" type="checkbox" />
            <span>이 모습으로 고정</span>
          </label>
          <select id="stage-pick" title="보여 줄 단계"></select>
        </div>
        <p class="muted" id="dex-hint"></p>
      </section>

      <section id="tab-rank" hidden>

      <label id="ranking-switch">
        <input id="ranking-on" type="checkbox" checked />
        <span>랭킹에 올리기</span>
      </label>
      <p class="muted" id="ranking-note">
        끄면 아무것도 서버로 안 보냅니다. 상어는 그대로 자랍니다.
      </p>

      <div id="account">
        <p class="muted" id="account-state">계정이 없습니다.</p>
        <div class="row">
          <input id="nickname" type="text" maxlength="12" placeholder="별명 (최대 12자)" />
          <button id="save-nickname">저장</button>
        </div>
        <details>
          <summary>복구 코드</summary>
          <p class="muted">
            다른 기기에 옮기거나 <b>몰래 야구와 같은 계정</b>으로 쓰려면 이 코드를 넣으세요.
          </p>
          <div class="row">
            <input id="code" type="text" placeholder="uuid.비밀" />
            <button id="use-code">불러오기</button>
          </div>
          <p class="code" id="my-code"></p>
        </details>
      </div>

      <div id="ranking">
        <h2>순위 <span class="muted" id="my-rank"></span></h2>
        <ol id="ranking-list"><li class="muted">불러오는 중…</li></ol>
      </div>
      </section>

      <p class="muted hint">⌥⇧S 밥 주기 멈추기 · ⌥⇧R 이 패널 · ⌥⇧H 숨기기</p>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
